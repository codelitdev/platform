packages:
  - "packages/*"
  - "examples/**"

overrides:
  esbuild: 0.28.2
  postcss: 8.5.28
  qs: 6.16.0
  ts-deepmerge: 8.0.0

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - core-js

strictPeerDependencies: false

# Keep pnpm's package-manager pin out of the dependency lockfile. This keeps
# pnpm-lock.yaml as a single document that tooling can parse reliably.
pmOnFail: ignore

minimumReleaseAgeExclude:
  - "@changesets/apply-release-plan@8.1.0"
  - "@changesets/cli@3.0.2"
  - "@changesets/git@4.0.1"
  - "@changesets/read@1.0.1"
  - "@eslint/plugin-kit@0.7.3"
  - eslint@10.10.0

patchedDependencies:
  '@anatine/zod-openapi@1.14.2': patches/@anatine__zod-openapi@1.14.2.patch

allowBuilds:
  core-js: false
  esbuild: true
