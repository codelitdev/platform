# Product-owned: edit freely. `platform-cli sync` never touches this file.
# Steps match what template-smoke verifies on a fresh product. Add
# `bun run format:check` after formatting the product once with `bun run format`.
name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      # `platform-cli create` intentionally does not resolve dependencies.
      # Bootstrap the product lockfile on its first run; all subsequent CI
      # installs are immutable and use the frozen lockfile below.
      - run: bun install
        if: ${{ !hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
